{% extends "base.html" %}
{% block title %}404 — Link not found{% endblock %}

{% block content %}
<div class="text-center py-5">
  <h1 class="display-1 fw-bold text-muted">404</h1>
  <h4 class="mb-3">This short link doesn't exist</h4>
  <p class="text-muted">It may have been mistyped or never created.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">← Back to home</a>
</div>
{% endblock %}
